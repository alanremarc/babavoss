<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>baba</title>
    <script>
      // The person's appearance before the first paint, from the settings the page is served with, which say what each
      // mode is painted in, its theme's name and numbers; where their file has none yet, the mode from the cookie an older
      // page kept, in Neutral. appearance.ts applies it by the same rules after.
      ;(() => {
        let p = {}
        let paint = {}
        let system
        try {
          const given = JSON.parse(document.getElementById("babavoss-settings")?.textContent || "{}")

          // The machine's mode, where the runtime could tell it: a browser can be wrong about its machine.
          system = given.system
          p = given.appearance
          paint = given.paint || {}
          if (!p) {
            const m = document.cookie.match(/(?:^|; )babavoss\.appearance=([^;]*)/)
            p = JSON.parse(decodeURIComponent(m ? m[1] : "") || "{}")
          }
          p = p || {}
        } catch {}
        const mode = p.mode === "dark" || (p.mode !== "light" && (system ? system === "dark" : matchMedia("(prefers-color-scheme: dark)").matches)) ? "dark" : "light"
        const root = document.documentElement
        const t = paint[mode] || {}
        root.classList.toggle("dark", mode === "dark")
        root.dataset.theme = t.theme || "neutral"
        root.style.colorScheme = mode
        for (const n of ["hue", "tint", "vivid"]) root.style.setProperty("--theme-" + n, String(Number(t[n]) || 0))
      })()
    </script>
  </head>
  <body>
    <!-- The page's ground and the strip's bar before the script draws them, as it will: React takes their place. -->
    <div id="root"><div class="flex h-dvh min-h-64 flex-col overflow-hidden text-xs"><nav class="h-11 shrink-0 border-b bg-sidebar"></nav></div></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
