<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>baba</title>
    <script>
      // The person's appearance before the first paint, from the settings the page is served with, which say what each
      // mode is painted in, its theme's name and numbers; where their file has none yet, the mode from the cookie an older
      // page kept, in Neutral. And the conventions, as the runtime told them, each an attribute and a number a variable too,
      // with the mode and a motion that follows the machine as the browser tells them. appearance.ts applies both after.
      ;(() => {
        let p = {}
        let paint = {}
        let system
        let conventions = {}
        let motion
        try {
          const given = JSON.parse(document.getElementById("babavoss-settings")?.textContent || "{}")

          // The machine's mode, where the runtime could tell it: a browser can be wrong about its machine.
          system = given.system
          p = given.appearance
          paint = given.paint || {}
          conventions = given.conventions || {}
          motion = given.preferences && given.preferences.motion
          if (!p) {
            const m = document.cookie.match(/(?:^|; )babavoss\.appearance=([^;]*)/)
            p = JSON.parse(decodeURIComponent(m ? m[1] : "") || "{}")
          }
          p = p || {}
        } catch {}
        const mode = p.mode === "dark" || (p.mode !== "light" && (system ? system === "dark" : matchMedia("(prefers-color-scheme: dark)").matches)) ? "dark" : "light"
        const root = document.documentElement
        const t = paint[mode] || {}
        root.classList.toggle("dark", mode === "dark")
        root.dataset.theme = t.theme || "neutral"
        root.style.colorScheme = mode
        for (const n of ["hue", "tint", "vivid"]) root.style.setProperty("--theme-" + n, String(Number(t[n]) || 0))
        conventions.mode = mode
        if (!motion || motion === "system") conventions.motion = matchMedia("(prefers-reduced-motion: reduce)").matches ? "reduced" : "full"
        for (const [name, value] of Object.entries(conventions)) {
          root.dataset[name] = String(value)
          if (typeof value === "number") root.style.setProperty("--" + name, String(value))
        }
        const side = root.dataset.rail
        root.dataset.rail = side === "right" || side === "top" || side === "bottom" ? side : "left"
      })()
    </script>
  </head>
  <body>
    <!-- The page's ground and the rail before the script draws them, at the side it will stand: React takes their place. -->
    <div id="root"><div id="babavoss-ground" class="flex h-dvh min-h-64 overflow-hidden text-xs"><nav class="shrink-0 bg-sidebar"></nav></div></div>
    <script>
      ;(() => {
        const side = document.documentElement.dataset.rail
        const ground = document.getElementById("babavoss-ground")
        const rail = ground.firstElementChild
        const column = side === "left" || side === "right"

        ground.classList.add({ left: "flex-row", right: "flex-row-reverse", top: "flex-col", bottom: "flex-col-reverse" }[side])
        rail.classList.add(column ? "w-11" : "h-11", { left: "border-r", right: "border-l", top: "border-b", bottom: "border-t" }[side])
      })()
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
