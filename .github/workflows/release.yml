name: Release

# A release is a tag vX.Y.Z of this repository: an app names it as github:alanremarc/babavoss#vX.Y.Z and installs the
# framework from it. When main holds a version that has no tag yet, the checks run and the tag is made, with a GitHub
# release whose notes are the version's section of the changelog. When main changes the framework or the skill under a
# version that is tagged already, it fails: the skill on main must always name the framework main holds.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            grep -q "^## $version\$" skills/baba/CHANGELOG.md || { echo "skills/baba/CHANGELOG.md has no section ## $version"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet "v$version" HEAD -- package.json packages skills/baba; then
            echo "The framework or the skill changed since v$version: raise the version in package.json and skills/baba/package.json,"
            echo "name its tag in what depends on it, and write its section in skills/baba/CHANGELOG.md."
            exit 1
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  tag:
    name: tag
    needs: [plan, check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          awk -v v="## $VERSION" '$0 == v { on = 1; next } on && /^## / { exit } on' skills/baba/CHANGELOG.md > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
