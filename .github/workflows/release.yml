name: Release

# The framework is staged on npm when a tag vX.Y.Z is pushed, after the checks pass. The workflow proves itself to npm
# with a short-lived GitHub token, npm's trusted publishing, so no npm token is kept here; that token may only stage.
# A maintainer then approves the staged version on npm with their own second factor, which publishes it. The skill is
# released by merging the tagged commit to main once the version is published, so that no installed skill names a
# framework npm does not have yet.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment the trusted publisher on npm is bound to: no other workflow or job can stage.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: one version for all of it, the tag's
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for file in packages/babavoss/package.json skills/baba/package.json; do
            version=$(node -p "require('./$file').version")
            [ "$version" = "$tag" ] || { echo "$file is $version, the tag is $tag"; exit 1; }
          done
      - name: npm that stages
        run: npm stage --help > /dev/null 2>&1 || npm install --global npm@12
      - name: stage
        working-directory: packages/babavoss
        run: npm stage publish --access public
      - name: what to do next
        run: |
          echo "babavoss ${GITHUB_REF_NAME#v} is staged. Approve it on npmjs.com, or with: npm stage list babavoss, then npm stage approve <id>." >> "$GITHUB_STEP_SUMMARY"
          echo "Once it is published, merge ${GITHUB_REF_NAME} to main." >> "$GITHUB_STEP_SUMMARY"
