name: Release

# A release is a tag vX.Y.Z of this repository: a project's .baba/ names it as github:alanremarc/babavoss#vX.Y.Z and
# installs the framework from it, and a role's door tells of a later one by the version main holds. When main holds a
# version that has no tag yet, the checks run and the tag is made, with a GitHub release whose notes are the version's
# section of the changelog. When main changes the package under a version that is tagged already, it fails.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            grep -q "^## $version\$" CHANGELOG.md || { echo "CHANGELOG.md has no section ## $version"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet "v$version" HEAD -- package.json bin framework skill template; then
            echo "The package changed since v$version: raise the version in package.json and write its section in CHANGELOG.md."
            exit 1
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  tag:
    name: tag
    needs: [plan, check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          awk -v v="## $VERSION" '$0 == v { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
